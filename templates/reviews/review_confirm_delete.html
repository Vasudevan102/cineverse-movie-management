{% extends 'base.html' %}
{% block title %}Delete Review - CineVerse{% endblock %}

{% block content %}
<div class="container" style="max-width: 580px;">
    <div class="card p-4 rounded-3 text-center shadow-lg" style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
        <i class="fa-solid fa-trash-can fa-3x text-danger mb-3"></i>
        <h3 class="fw-bold text-white mb-2">Delete Review?</h3>
        <p class="text-secondary">Are you sure you want to delete your review for <strong>{{ review.movie.title }}</strong>?</p>

        <div class="p-3 text-start text-white mb-4 rounded-3" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);">
            <div class="text-warning fw-bold mb-1">{{ review.rating }} Stars ★</div>
            <p class="small text-secondary mb-0">{{ review.comment }}</p>
        </div>

        <form method="POST" action="{% url 'review_delete' review.id %}">
            {% csrf_token %}
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-accent btn-lg fw-bold">Delete Review</button>
                <a href="{% url 'movie_detail' review.movie.slug %}" class="btn btn-outline-glass">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
